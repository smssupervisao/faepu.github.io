<!-- BLOCO 1: ABA INÍCIO / DESTAQUE (800x400) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #f8fafc; }
    
    .faepu-box {
        width: 100%;
        max-width: 800px;
        height: 400px;
        padding: 20px;
        background: linear-gradient(135deg, #003366 0%, #00529b 60%, #0077b6 100%);
        color: #ffffff;
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
        overflow: hidden;
        margin: 0 auto;
        box-shadow: 0 4px 15px rgba(0,51,102,0.15);
    }

    .faepu-box::after {
        content: '';
        position: absolute;
        right: -60px;
        bottom: -60px;
        width: 250px;
        height: 250px;
        background: rgba(255, 255, 255, 0.06);
        border-radius: 50%;
        pointer-events: none;
    }

    .faepu-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(255, 255, 255, 0.18);
        padding: 5px 12px;
        border-radius: 20px;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        border: 1px solid rgba(255, 255, 255, 0.25);
        width: fit-content;
    }

    .faepu-title {
        font-size: 1.6rem;
        font-weight: 800;
        line-height: 1.25;
        margin-top: 10px;
    }

    .faepu-subtitle {
        font-size: 0.9rem;
        opacity: 0.9;
        font-weight: 300;
        margin-top: 6px;
        line-height: 1.4;
    }

    .faepu-stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        background: rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(8px);
        padding: 12px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .stat-item { text-align: center; }
    .stat-item h4 { font-size: 1.1rem; font-weight: 800; color: #ffffff; }
    .stat-item p { font-size: 0.7rem; opacity: 0.85; font-weight: 500; }

    .faepu-actions {
        display: flex;
        gap: 10px;
    }

    .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px 18px;
        border-radius: 6px;
        font-weight: 700;
        font-size: 0.85rem;
        text-decoration: none;
        transition: all 0.2s;
    }

    .btn-primary { background: #00a896; color: #ffffff; }
    .btn-primary:hover { background: #028090; }
    .btn-outline { background: rgba(255, 255, 255, 0.15); color: #fff; border: 1px solid rgba(255,255,255,0.3); }
    .btn-outline:hover { background: rgba(255, 255, 255, 0.25); }

    @media (max-width: 500px) {
        .faepu-title { font-size: 1.25rem; }
        .faepu-subtitle { font-size: 0.8rem; }
        .faepu-stats { grid-template-columns: 1fr; gap: 5px; }
    }
</style>

<div class="faepu-box">
    <div>
        <div class="faepu-badge">
            <i class="fa-solid fa-graduation-cap"></i> FAEPU Ensino & Pesquisa
        </div>
        <h1 class="faepu-title">Plataforma Integrada de Capacitação Profissional</h1>
        <p class="faepu-subtitle">Desenvolvimento contínuo em saúde, gestão e inovação tecnológica com a excelência da Fundação FAEPU.</p>
    </div>

    <div class="faepu-stats">
        <div class="stat-item">
            <h4>+15.000</h4>
            <p>Alunos Capacitados</p>
        </div>
        <div class="stat-item">
            <h4>100%</h4>
            <p>Certificados Válidos</p>
        </div>
        <div class="stat-item">
            <h4>24/7</h4>
            <p>Acesso Flexível</p>
        </div>
    </div>

    <div class="faepu-actions">
        <a href="https://www.faepu.org.br" target="_blank" class="btn btn-primary">
            <i class="fa-solid fa-globe"></i> Portal FAEPU Oficial
        </a>
        <a href="#" class="btn btn-outline">
            <i class="fa-solid fa-circle-info"></i> Sobre a Fundação
        </a>
    </div>
</div>
